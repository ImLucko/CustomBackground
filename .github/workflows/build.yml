
name: Build Custom Background

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android ARM32
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android32
          sdk: latest

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: CustomBackground-Android32
          path: ${{ steps.build.outputs.build-output }}/*.geod
